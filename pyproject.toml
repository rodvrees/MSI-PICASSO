[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MSI-PICASSO"
version = "0.2.0"
description = "Symmetric target-decoy scoring of MALDI-MSI MS1 data (timsTOF .d) against LC-MS/MS peptides"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyteomics>=4.7",
    "psm_utils>=1.1",
    "brain-isotopic-distribution>=1.5",
    "alphatims>=1.0",
    "numba>=0.57",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]

[project.scripts]
picasso = "msi_picasso.cli:main"
msi-picasso = "msi_picasso.cli:main"

[tool.pytest.ini_options]
testpaths = ["msi_picasso/tests"]

[tool.setuptools.packages.find]
where = ["."]
